services:
  comfyui-worker:
    image: duodecanol/worker-comfyui:latest-base
    pull_policy: never
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    develop:
      watch:
        - action: sync
          path: ./src
          target: /src
          ignore:
            - node_modules/
            - .venv/
        - action: rebuild
          path: Dockerfile
    environment:
      SERVE_API_LOCALLY: true
      COMFY_SERVER_CONFIG: |
        --mmap-torch-files
        --cuda-malloc
        --supports-fp8-compute
        --use-pytorch-cross-attention
        --lowvram
    ports:
      - "8000:8000"
      - "8188:8188"
    volumes:
      - ./data/comfyui/output:/comfyui/output
      - ./data/runpod-volume:/runpod-volume
